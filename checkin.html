<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1D4B">
<title>Entrance Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1D4B; --crimson: #9E0E18; --crimson-hi: #C50337; --gold: #CC9E4A; --gold-soft: #E2C48A;
    --ivory: #F7EBE0; --ink-2: rgba(247,235,224,.74); --ink-3: rgba(247,235,224,.55); --line: rgba(247,235,224,.22);
    --serif: "Cormorant Garamond", Georgia, serif; --sans: Manrope, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; color: var(--ivory); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    background: radial-gradient(80% 40% at 50% -6%, rgba(226,196,138,.22), transparent 70%), radial-gradient(90% 40% at 50% 110%, rgba(197,3,55,.35), transparent 72%), linear-gradient(180deg, #0A1D4B, #121226 70%, #171721); background-attachment: fixed; }
  button, input { font: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 16px 28px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .plq { background: rgba(247,235,224,.94); border-radius: 10px; padding: 5px 10px; display: inline-flex; }
  .plq img { width: 92px; display: block; }
  .head b { font: 600 22px/1.1 var(--serif); }
  .head .sp { flex: 1; }
  .chip { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .glass { margin-top: 18px; border-radius: 20px; padding: 22px 18px; background: linear-gradient(155deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 1px solid var(--line); }
  h1 { font: 600 28px/1.1 var(--serif); margin: 0 0 6px; }
  .hint { color: var(--ink-2); font-size: 14px; margin: 0 0 6px; }
  label { display: block; font-weight: 600; font-size: 13.5px; margin: 16px 0 7px; }
  .inp { width: 100%; height: 52px; padding: 0 14px; font-weight: 600; font-size: 18px; letter-spacing: .06em; color: var(--ivory); background: rgba(255,255,255,.08); border: 1px solid rgba(247,235,224,.3); border-radius: 14px; outline: none; }
  .inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(204,158,74,.22); }
  .btn { width: 100%; height: 52px; margin-top: 16px; border: 0; border-radius: 14px; font-weight: 700; font-size: 16px; color: #fff; background: linear-gradient(180deg, var(--crimson-hi), var(--crimson)); cursor: pointer; }
  .btn:disabled { opacity: .6; }
  .btn.quiet { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--ivory); }
  .err { color: #FF9A9A; font-size: 13.5px; margin-top: 10px; min-height: 1em; }
  .cam { position: relative; margin-top: 14px; border-radius: 18px; overflow: hidden; background: #0b0d14; min-height: 300px; }
  #reader { width: 100%; }
  #reader video { width: 100% !important; display: block; border-radius: 18px; }
  #reader img, #reader__dashboard_section_csr, #reader__header_message { display: none !important; }
  .camMsg { padding: 26px 18px; text-align: center; color: var(--ink-2); font-size: 14px; }
  .camMsg .btn { margin-top: 12px; }
  .tip { text-align: center; color: var(--ink-3); font-size: 13px; margin: 10px 0 0; }
  .segs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .segs button { height: 50px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ivory); font-weight: 700; cursor: pointer; }
  .segs button[aria-pressed=true] { border-color: var(--gold); background: rgba(204,158,74,.2); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); margin-top: 8px; }
  .row .n { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .row .d { font-size: 12.5px; color: var(--ink-3); }
  .row button { padding: 10px 14px; border-radius: 12px; border: 0; font-weight: 800; font-size: 14px; color: #fff; background: #1f8a58; cursor: pointer; white-space: nowrap; }
  .row .st { font-size: 12.5px; font-weight: 700; white-space: nowrap; text-align: right; }
  .row .st.in { color: var(--gold-soft); } .row .st.no { color: #FF9A9A; }
  .empty { color: var(--ink-3); font-size: 13.5px; text-align: center; margin: 14px 0; }
  .foot { display: flex; justify-content: space-between; margin-top: 18px; font-size: 12.5px; color: var(--ink-3); }
  .foot a { color: var(--ink-2); }

  .res { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); text-align: center; color: #fff; }
  .res[hidden] { display: none; }
  .res.ok { background: linear-gradient(180deg, #23955f, #136343); }
  .res.warn { background: linear-gradient(180deg, #d0911a, #8a5d06); }
  .res.bad { background: linear-gradient(180deg, #c62c43, #7d1222); }
  .res.wait { background: linear-gradient(180deg, #23314f, #121a30); }
  .res .in { width: 100%; max-width: 420px; }
  .res .icon { width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font: 800 44px/1 var(--sans); }
  .res .big { font: 800 27px/1.15 var(--sans); }
  .res .name { font: 800 24px/1.2 var(--sans); margin-top: 18px; }
  .res .det { font-size: 15px; opacity: .92; margin-top: 4px; }
  .res .tbl { margin: 18px auto 0; padding: 10px 30px; border-radius: 16px; background: rgba(255,255,255,.95); color: #12203f; width: max-content; }
  .res .tbl small { display: block; font: 800 12px var(--sans); letter-spacing: .2em; }
  .res .tbl b { display: block; font: 800 52px/1 var(--sans); }
  .res .act { font-size: 16px; font-weight: 700; margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.2); }
  .res .btn { margin-top: 22px; background: rgba(255,255,255,.96); color: #12203f; height: 58px; font-size: 18px; }
  .spin { width: 40px; height: 40px; margin: 0 auto 14px; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .sync { padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; white-space: nowrap; background: rgba(31,138,88,.25); border: 1px solid rgba(127,209,166,.45); }
  .sync.wait { background: rgba(208,145,26,.25); border-color: rgba(240,190,90,.5); }
  .sync.off { background: rgba(198,44,67,.3); border-color: rgba(255,154,154,.5); }
  .ready { text-align: center; color: var(--ink-3); font-size: 12.5px; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="plq"><img src="logo.png" alt="Metropolitan"></span>
    <b>Check-in</b>
    <span class="sp"></span>
    <span class="sync" id="sync" hidden>✓ Saved</span>
    <span class="chip" id="count" hidden>This phone: 0</span>
  </div>

  <!-- PIN -->
  <section class="glass" id="vPin">
    <h1>Entrance check-in</h1>
    <p class="hint">Metropolitan Excellence Awards and Year End Party. For the entrance team only.</p>
    <form id="pf" novalidate>
      <label for="pin">Scanner PIN</label>
      <input class="inp" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6 digits">
      <button class="btn" id="pb" type="submit">Start</button>
      <div class="err" id="pe" role="alert"></div>
    </form>
  </section>

  <!-- Main -->
  <section id="vMain" hidden>
    <div id="vScan">
      <div class="cam">
        <div id="reader"></div>
        <div class="camMsg" id="camMsg" hidden></div>
      </div>
      <p class="tip">Hold the guest's QR code inside the box.</p>
      <p class="ready" id="ready"></p>
    </div>
    <div id="vSearch" hidden>
      <input class="inp" id="q" type="search" autocomplete="off" placeholder="Employee number or name" style="margin-top:14px">
      <div id="list"></div>
    </div>
    <div class="segs">
      <button type="button" id="tScan" aria-pressed="true">Scan QR</button>
      <button type="button" id="tSearch" aria-pressed="false">Search</button>
    </div>
    <div class="foot"><span>Problems? Send the guest to the HR desk.</span><a href="#" id="out">Log out</a></div>
  </section>
</div>

<div class="res" id="res" hidden><div class="in" id="resIn"></div></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PIN = '', scanner = null, busy = false, mode = 'scan', count = 0, lastCode = '', lastAt = 0;
  // Guest list kept on this phone: decisions are instant; check-ins go to the server in the background.
  var G = null, byCode = {}, byEmp = {}, Q = [], sending = false, listAt = 0, autoNext = null;
  function sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function lget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lset(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clock(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var t = d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Colombo' });
    return t.replace(':', '.').replace(/\s?am$/i, ' A.M.').replace(/\s?pm$/i, ' P.M.');
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function setCount(n) { count = n; lset('mea_ci_count', String(n)); $('count').textContent = 'This phone: ' + n; }

  // ---------- guest list ----------
  function useList(rows, cols) {
    var ix = {}; cols.forEach(function (c, i) { ix[c] = i; });
    byCode = {}; byEmp = {};
    rows.forEach(function (r) {
      var p = { code: r[ix.code], emp: r[ix.emp], name: r[ix.name], dept: r[ix.dept], table: r[ix.table], status: r[ix.status], arrived: r[ix.arrived] || '' };
      byCode[String(p.code).toUpperCase()] = p; byEmp[p.emp] = p;
    });
    Q.forEach(function (q) { if (byEmp[q.emp] && !byEmp[q.emp].arrived) byEmp[q.emp].arrived = q.at; });   // keep this phone's unsent check-ins
    G = true; showReady();
  }
  function showReady() {
    var n = 0, a = 0; for (var k in byEmp) { if (byEmp[k].status === 'Attending') { n++; if (byEmp[k].arrived) a++; } }
    $('ready').textContent = G ? 'Guest list ready: ' + a + ' of ' + n + ' arrived (all phones)' : '';
  }
  async function loadList(quiet) {
    var r = await window.rsvpCall({ action: 'guestlist', pin: PIN }, 2);
    if (!r.ok) {
      if (r.pin === false) return badPin(r.error);
      if (!quiet && !G) $('ready').textContent = 'Could not get the guest list yet. Scanning still works, a little slower. Retrying…';
      return false;
    }
    useList(r.rows, r.cols); listAt = Date.now();
    lset('mea_gl', JSON.stringify({ at: listAt, cols: r.cols, rows: r.rows }));
    return true;
  }
  async function loadArrivals() {
    var r = await window.rsvpCall({ action: 'arrivals', pin: PIN }, 1);
    if (!r || !r.ok) { if (r && r.pin === false) badPin(r.error); return; }
    r.list.forEach(function (x) { var p = byEmp[x[0]]; if (p && !p.arrived) p.arrived = x[1]; });
    showReady();
  }

  // ---------- background sending (kept on the phone until the server has it) ----------
  function saveQ() { lset('mea_q', JSON.stringify(Q)); showSync(); }
  function showSync(off) {
    var el = $('sync'); el.hidden = false;
    if (off) { el.className = 'sync off'; el.textContent = '⚠ ' + Q.length + ' not sent · no connection'; return; }
    if (Q.length) { el.className = 'sync wait'; el.textContent = '⟳ Sending ' + Q.length; }
    else { el.className = 'sync'; el.textContent = '✓ All saved'; }
  }
  async function pump() {
    if (sending || !Q.length) return;
    sending = true;
    while (Q.length) {
      var q = Q[0];
      var r = await window.rsvpCall({ action: 'checkinq', pin: PIN, emp: q.emp, at: q.at, how: q.how }, 2);
      if (r && r.ok) { Q.shift(); saveQ(); continue; }                  // saved (or another phone had it first)
      if (r && r.pin === false) { sending = false; badPin(r.error); return; }
      showSync(true); break;                                           // no connection: try again shortly
    }
    sending = false;
  }
  function queue(emp, how) { Q.push({ emp: emp, at: new Date().toISOString(), how: how }); saveQ(); pump(); }

  // ---------- PIN ----------
  $('pin').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
  $('pf').addEventListener('submit', async function (e) {
    e.preventDefault(); $('pe').textContent = '';
    var p = $('pin').value.trim();
    if (!/^\d{6}$/.test(p)) { $('pe').textContent = 'Enter the 6-digit PIN from HR.'; return; }
    $('pb').disabled = true; $('pb').textContent = 'Checking…';
    var r = await window.rsvpCall({ action: 'pin', pin: p }, 2);
    $('pb').disabled = false; $('pb').textContent = 'Start';
    if (!r.ok) { $('pe').textContent = r.error || 'Could not check the PIN.'; return; }
    PIN = p; sset('mea_pin', p); begin();
  });
  $('out').addEventListener('click', function (e) {
    e.preventDefault();
    if (Q.length && !confirmOut()) return;
    sset('mea_pin', null); location.reload();
  });
  function confirmOut() {
    if ($('out').dataset.armed) return true;
    $('out').dataset.armed = '1'; $('out').textContent = Q.length + ' not sent yet. Tap again to log out anyway';
    setTimeout(function () { delete $('out').dataset.armed; $('out').textContent = 'Log out'; }, 5000);
    return false;
  }
  function badPin(msg) {
    sset('mea_pin', null);
    showRes('bad', '<div class="icon">!</div><div class="big">PIN no longer valid</div><div class="act">' + esc(msg || 'Ask HR for the new PIN.') + (Q.length ? '<br>' + Q.length + ' check-ins on this phone are kept and will be sent after you log in again.' : '') + '</div>', false, function () { location.reload(); });
    return false;
  }
  function begin() {
    $('vPin').hidden = true; $('vMain').hidden = false; $('count').hidden = false;
    setCount(parseInt(lget('mea_ci_count') || '0', 10) || 0);
    try { Q = JSON.parse(lget('mea_q') || '[]') || []; } catch (e) { Q = []; }
    try { var c = JSON.parse(lget('mea_gl') || 'null'); if (c && c.rows && Date.now() - c.at < 24 * 3600 * 1000) useList(c.rows, c.cols); } catch (e) {}
    showSync();
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    setMode('scan');
    loadList().then(function () { pump(); });
    setInterval(function () { pump(); }, 5000);
    setInterval(function () { if (document.visibilityState === 'visible') loadArrivals(); }, 30000);
    setInterval(function () { if (document.visibilityState === 'visible') loadList(true); }, 5 * 60000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') { pump(); if (Date.now() - listAt > 60000) loadArrivals(); }
      try { if (document.visibilityState === 'visible' && navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    });
  }

  // ---------- camera ----------
  function camError(msg) {
    $('camMsg').hidden = false;
    $('camMsg').innerHTML = esc(msg) + '<button class="btn quiet" type="button" id="camRetry">Try the camera again</button><button class="btn quiet" type="button" id="camSearch">Use Search instead</button>';
    $('camRetry').onclick = function () { $('camMsg').hidden = true; startCam(); };
    $('camSearch').onclick = function () { setMode('search'); };
  }
  function startCam() {
    if (!window.Html5Qrcode) { camError('The scanner could not load. Check the internet connection and reload the page.'); return; }
    if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    if (scanner.isScanning) return;
    var box = Math.min(260, Math.floor(Math.min(window.innerWidth - 60, 320) * 0.82));
    scanner.start({ facingMode: 'environment' }, { fps: 15, qrbox: { width: box, height: box }, aspectRatio: 1 }, onCode, function () {})
      .catch(function () { camError('The camera did not start. Allow camera access for this page (tap the icon next to the web address), then try again.'); });
  }
  function stopCam() { if (scanner && scanner.isScanning) return scanner.stop().catch(function () {}); return Promise.resolve(); }
  function pauseCam() { try { if (scanner && scanner.isScanning) scanner.pause(true); } catch (e) {} }
  function resumeCam() { try { if (scanner && mode === 'scan') scanner.resume(); } catch (e) {} }
  function onCode(text) {
    if (busy) return;
    var now = Date.now();
    if (text === lastCode && now - lastAt < 3000) return;   // same code still in front of the camera
    lastCode = text; lastAt = now;
    busy = true; pauseCam();
    var code = String(text || '').trim().toUpperCase(), p = byCode[code];
    if (p) { decide(p, 'QR scan'); return; }
    if (G && !/^MEA1-\d{6}-[0-9A-F]{10}$/.test(code)) { result('invalid', null); return; }   // not our pass at all
    send({ action: 'scan', pin: PIN, code: text });          // not in the list yet (added in the last minutes): ask the server
  }

  // ---------- deciding (on the phone, instant) ----------
  function decide(p, how) {
    if (p.status !== 'Attending') { result('notattending', p); return; }
    if (p.arrived) { result('already', p); return; }
    p.arrived = new Date().toISOString();
    queue(p.emp, how);
    result('ok', p); showReady();
  }
  function result(kind, p) {
    p = p || {};
    var who = p.name ? '<div class="name">' + esc(p.name) + '</div><div class="det">' + esc(p.emp) + (p.dept ? ' · ' + esc(p.dept) : '') + '</div>' : '';
    if (kind === 'ok') {
      setCount(count + 1); buzz(120);
      var tbl = p.table ? '<div class="tbl"><small>TABLE</small><b>' + esc(p.table) + '</b></div>' : '';
      showRes('ok', '<div class="icon">✓</div><div class="big">Welcome</div>' + who + tbl + '<div class="act">Hand over the tag' + (p.table ? ' and show the way to table ' + esc(p.table) : '') + '.</div>', false, null, 4000);
    } else if (kind === 'already') {
      buzz([60, 60, 60]);
      showRes('warn', '<div class="icon">!</div><div class="big">Already checked in</div>' + who + '<div class="act">Checked in at ' + esc(clock(p.arrived)) + '.<br>Ask the guest their name. If it does not match the name above, send them to the HR desk.</div>');
    } else if (kind === 'notattending') {
      buzz([60, 60, 60]);
      var why = p.status === 'Not attending' ? 'Marked as not attending.' : 'Did not confirm participation.';
      showRes('bad', '<div class="icon">✕</div><div class="big">Not on the attending list</div>' + who + '<div class="act">' + why + '<br>Please send them to the HR desk.</div>');
    } else {
      buzz([60, 60, 60]);
      showRes('bad', '<div class="icon">✕</div><div class="big">Not a valid pass</div><div class="act">This QR code is not from our system.<br>Please send the guest to the HR desk.</div>');
    }
  }
  // Online check, used only when the guest list does not know the person yet
  async function send(payload) {
    showRes('wait', '<div class="spin"></div><div class="big">Checking…</div>', true);
    var r = await window.rsvpCall(payload, 2);
    if (!r.ok) {
      if (r.pin === false) { badPin(r.error); return; }
      buzz([60, 60, 60]);
      showRes('bad', '<div class="icon">!</div><div class="big">Could not check</div><div class="act">' + esc(r.error || 'No connection.') + '<br>Check mobile data and try again, or use Search.</div>');
      return;
    }
    var p = r.person || {};
    if (p.emp) { byEmp[p.emp] = byEmp[p.emp] || p; if (r.result === 'ok' || r.result === 'already') byEmp[p.emp].arrived = p.arrived || new Date().toISOString(); }
    result(r.result === 'ok' ? 'ok' : r.result === 'already' ? 'already' : r.result === 'notattending' ? 'notattending' : 'invalid', p);
    if (r.result === 'ok') loadList(true);      // pick up the newly added person for next time
  }
  function showRes(cls, html, noBtn, onNext, autoMs) {
    clearTimeout(autoNext);
    $('res').className = 'res ' + cls;
    $('resIn').innerHTML = html + (noBtn ? '' : '<button class="btn" type="button" id="next">Next guest</button>');
    $('res').hidden = false;
    if (noBtn) return;
    var next = function () { clearTimeout(autoNext); $('res').hidden = true; busy = false; if (onNext) onNext(); else if (mode === 'scan') resumeCam(); else search(); };
    $('next').onclick = next;
    if (autoMs) autoNext = setTimeout(next, autoMs);   // a welcome closes by itself so the next guest can scan
  }

  // ---------- search (on the phone, instant) ----------
  var tmr = null;
  $('q').addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(search, 150); });
  async function search() {
    var q = $('q').value.trim().toLowerCase();
    if (q.length < 2) { $('list').innerHTML = '<p class="empty">Type at least 2 letters or numbers.</p>'; return; }
    var list;
    if (G) {
      var digits = /^\d+$/.test(q);
      list = []; for (var k in byEmp) { var p = byEmp[k]; if (digits ? p.emp.indexOf(q) >= 0 : String(p.name).toLowerCase().indexOf(q) >= 0) list.push(p); if (list.length >= 15) break; }
    } else {
      var r = await window.rsvpCall({ action: 'find', pin: PIN, q: q }, 2);
      if (q !== $('q').value.trim().toLowerCase()) return;
      if (!r.ok) { $('list').innerHTML = '<p class="empty">' + esc(r.error || 'Could not search.') + '</p>'; return; }
      list = r.list;
    }
    if (!list.length) { $('list').innerHTML = '<p class="empty">No one found. Check the spelling, or send the guest to the HR desk.</p>'; return; }
    $('list').innerHTML = list.map(function (p) {
      var right = p.status !== 'Attending' ? '<span class="st no">' + (p.status === 'Not attending' ? 'Not attending' : 'Not confirmed') + '</span>'
        : p.arrived ? '<span class="st in">In at ' + esc(clock(p.arrived)) + '</span>'
        : '<button type="button" data-emp="' + esc(p.emp) + '">Check in</button>';
      return '<div class="row"><div><div class="n">' + esc(p.name) + '</div><div class="d">' + esc(p.emp) + ' · ' + esc(p.dept) + (p.table ? ' · Table ' + esc(p.table) : '') + '</div></div>' + right + '</div>';
    }).join('');
  }
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-emp]'); if (!b || busy) return;
    busy = true;
    var p = byEmp[b.dataset.emp];
    if (G && p) decide(p, 'Search'); else send({ action: 'checkin', pin: PIN, emp: b.dataset.emp });
  });

  // ---------- tabs ----------
  function setMode(m) {
    mode = m;
    $('tScan').setAttribute('aria-pressed', m === 'scan'); $('tSearch').setAttribute('aria-pressed', m === 'search');
    $('vScan').hidden = m !== 'scan'; $('vSearch').hidden = m !== 'search';
    if (m === 'scan') { $('camMsg').hidden = true; startCam(); }
    else { stopCam(); $('q').focus(); search(); }
  }
  $('tScan').addEventListener('click', function () { if (mode !== 'scan') setMode('scan'); });
  $('tSearch').addEventListener('click', function () { if (mode !== 'search') setMode('search'); });
  var saved = sget('mea_pin');
  if (saved) { PIN = saved; begin(); }
})();
</script>
</body>
</html>
